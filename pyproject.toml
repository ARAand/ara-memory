[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ara-memory"
version = "0.1.0"
description = "Local-first temporal memory store for Ara/Codex sessions."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Ara-Codex" }]
license = { text = "MIT" }
dependencies = ["cryptography>=42"]

[project.scripts]
ara-memory = "ara_memory.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["ara_memory*"]
